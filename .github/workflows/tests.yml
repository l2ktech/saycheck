name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python — validators and bundled examples
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Node — pass-rate maths
        run: node --test tests/*.test.mjs

      - name: Schemas are valid JSON
        run: |
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path("schema").glob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
              print("ok", p)
          PY
