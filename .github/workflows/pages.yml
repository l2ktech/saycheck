name: Deploy to Pages

# The site is published from the repository root, not from web/, because the
# runner loads ../examples/*.suite.json and ../examples/audio/*.wav at runtime.
# Publishing only web/ would 404 on every bundled example.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "examples/**"
      - "index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — no absolute asset paths
        run: |
          # Pages serves the site under /<repo>/, so "/core/x.js" would 404.
          if grep -rnE '(src|href)="/[^/]' web --include='*.html' --include='*.js'; then
            echo "::error::absolute path found in web/ — use ./relative/paths instead"
            exit 1
          fi

      - name: Guard — example suite must validate
        run: |
          python3 scripts/validate.py suite examples/saycheck-ja-45.suite.json
          python3 scripts/validate.py session examples/sample.session.json

      - name: Guard — referenced audio must exist
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          suite_path = pathlib.Path("examples/saycheck-ja-45.suite.json")
          suite = json.loads(suite_path.read_text(encoding="utf-8"))
          base = suite_path.parent / (suite.get("audioBase") or "")
          missing = [u["audio"]["path"] for u in suite["utterances"]
                     if u.get("audio") and not (base / u["audio"]["path"]).exists()]
          if missing:
              print("::error::missing audio:", *missing, sep="\n  ")
              sys.exit(1)
          print(f"all {sum(1 for u in suite['utterances'] if u.get('audio'))} audio files present")
          PY

      - name: Strip git metadata before upload
        run: rm -rf .git

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
