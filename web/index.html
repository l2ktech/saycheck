<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SayCheck · 机器人语音调试台</title>
<meta name="description" content="Zero-integration voice test harness for robots. Play a phrase list, sense the response, get a pass-rate table.">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    SayCheck <small>机器人语音调试台</small>
  </div>
  <div class="chips">
    <span class="chip">按功能分组</span>
    <span class="chip">声音 + 动作双检测</span>
    <span class="chip">每轮人工判定</span>
    <span class="chip">实时排行</span>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="pill-suite">未加载套件</span>
  <span class="pill" id="pill-sensors">传感器未授权</span>
  <span class="pill" id="pill-store">已入库 0 轮</span>
</header>

<main>

  <!-- ============================ 舞台 ============================ -->
  <section class="stage" id="stage">
    <div class="stage-main">
      <div class="stage-top">
        <span class="stage-flag" id="run-flag">待机</span>
        <span class="stage-id" id="run-utt-id"></span>
      </div>
      <div class="stage-text" id="run-text">选好参数后点「开始测试」</div>
      <div class="stage-sub" id="run-sub">当前没有任何词在跑</div>
    </div>

    <div class="stage-side">
      <div class="stage-actions" id="actions-idle">
        <button class="primary" id="btn-start">▶ 开始</button>
        <button id="btn-stop" disabled>■ 停</button>
      </div>
      <div class="stage-actions" id="actions-verdict" hidden>
        <button class="pass" id="btn-pass">○ 触发<kbd>Y</kbd></button>
        <button class="fail" id="btn-fail">× 没触发<kbd>N</kbd></button>
        <button class="replay" id="btn-replay">↻ 重播<kbd>R</kbd></button>
      </div>

      <div class="meters">
        <div class="meter">
          <span class="meter-k">声音</span>
          <div class="bar thresh"><i id="bar-rms"></i></div>
          <span class="meter-v" id="m-rms">—</span>
        </div>
        <div class="meter">
          <span class="meter-k">动作</span>
          <div class="bar thresh"><i id="bar-motion"></i></div>
          <span class="meter-v" id="m-motion">—</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================ 控制条 ============================ -->
  <section class="controls">
    <div class="field">
      <label for="opt-rule">判定依据</label>
      <select id="opt-rule">
        <option value="any">声音或动作任一</option>
        <option value="motion">必须有动作才算触发</option>
        <option value="sound">必须有声音才算触发</option>
      </select>
    </div>
    <div class="field">
      <label for="opt-judge">判定方式</label>
      <select id="opt-judge" title="人工：每轮停下等你点 ○/×；自动：达标就算触发，直接往下跑">
        <option value="manual">人工判定（我点 ○/×）</option>
        <option value="auto">自动判定（达标就算）</option>
      </select>
    </div>
    <div class="field">
      <label for="opt-rounds">每个词跑几次</label>
      <input type="number" id="opt-rounds" min="1" max="50" value="5">
    </div>
    <div class="field" id="wake-field" hidden>
      <label for="opt-wake">唤醒词</label>
      <label class="switch wake-switch"><input type="checkbox" id="opt-wake" checked><span id="wake-label">每轮先播唤醒音</span></label>
    </div>
    <div class="field">
      <label for="opt-gap">每轮之间歇 (ms)</label>
      <input type="number" id="opt-gap" min="0" max="30000" step="100" value="1500">
    </div>
    <div class="field grow">
      <label for="suite-url">套件</label>
      <input type="text" id="suite-url" value="../examples/saycheck-tri-36.suite.json" list="suite-presets" spellcheck="false">
      <datalist id="suite-presets">
        <option value="../examples/saycheck-tri-36.suite.json">三语 英/马来/中（36 句）</option>
        <option value="../examples/saycheck-ja-45.suite.json">日语（45 句）</option>
      </datalist>
    </div>
    <div class="field btns">
      <label>&nbsp;</label>
      <div class="btn-row">
        <button id="btn-load-suite">加载</button>
        <button id="btn-pick-file" class="ghost" title="从本地 JSON 导入">导入…</button>
        <button id="btn-check-devices">授权麦克风+摄像头</button>
      </div>
    </div>
    <input type="file" id="file-input" accept=".json,application/json" hidden>
  </section>

  <details class="advanced">
    <summary>高级参数（一般不用改，点开才显示）</summary>
    <div class="adv-body">
      <div class="field"><label for="opt-window">没反应最多等 (ms)</label><input type="number" id="opt-window" min="500" max="30000" step="100" value="5000"><span class="hint">一直没声没动，到点就弹判定</span></div>
      <div class="field"><label for="opt-settle">播完先静置 (ms)</label><input type="number" id="opt-settle" min="0" max="5000" step="50" value="900"><span class="hint">避免把播放尾音当成应答</span></div>
      <div class="field"><label for="opt-silence">有反应后安静 (ms)</label><input type="number" id="opt-silence" min="200" max="10000" step="50" value="1000"><span class="hint">安静这么久就提前结束</span></div>
      <div class="field"><label for="opt-rms">声音阈值 (dBFS)</label><input type="number" id="opt-rms" min="-90" max="-5" step="1" value="-34"><span class="hint">比环境底噪高 15–20 dB</span></div>
      <div class="field"><label for="opt-motion">动作阈值 (帧差)</label><input type="number" id="opt-motion" min="1" max="60" step="0.5" value="3"><span class="hint">静止 &lt;1，动起来 &gt;3</span></div>
      <div class="field"><label for="opt-record">录制失败样本</label><label class="switch"><input type="checkbox" id="opt-record"><span>存本机 IndexedDB</span></label></div>
      <div class="field" style="align-self:flex-end">
        <button id="btn-calibrate" class="small">校准环境底噪</button>
        <span class="hint" id="cal-hint">校准时请保持安静</span>
      </div>
    </div>
  </details>

  <!-- ============================ 组筛选 ============================ -->
  <section class="groupbar" id="group-chips"></section>

  <!-- ============================ 工具条 ============================ -->
  <section class="toolbar">
    <span class="muted" id="restore-note">等待授权</span>
    <div class="progress"><i id="progress-fill"></i></div>
    <span class="mono" id="progress-text">进度 0/0 轮 (0%)</span>
    <div class="btn-row">
      <button class="small ghost" id="btn-export-session">导出 JSON</button>
      <button class="small ghost" id="btn-export-trials">导出逐轮明细</button>
      <button class="small ghost" id="btn-export-ranking">导出排行</button>
      <button class="small ghost danger" id="btn-clear">清空记录</button>
    </div>
  </section>

  <!-- ============================ 领奖台 ============================ -->
  <section class="podium" id="podium"></section>

  <!-- ============================ 分组表格 ============================ -->
  <section class="tables" id="tables"></section>

</main>

<footer>
  <span>SayCheck</span>
  <span class="sep">·</span>
  <span>无账号 · 无上传 · 录音只存本机</span>
  <span class="sep">·</span>
  <a href="https://github.com/l2ktech/saycheck" target="_blank" rel="noopener">GitHub</a>
  <span class="spacer"></span>
  <span class="muted" id="footer-hint">判定 = 麦克风 RMS + 摄像头帧差 + 人工一键</span>
</footer>

<div id="toast"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
